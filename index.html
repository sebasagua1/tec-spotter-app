<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#003DA5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141734" media="(prefers-color-scheme: dark)" />
    <script>
      // Enciende el modo oscuro ANTES del primer pintado. Tiene que ser un
      // script en línea: los módulos van diferidos y para cuando corren ya
      // se ha visto el fondo claro, que de noche es un fogonazo en la cara.
      // El resto (cambios en vivo) está en src/lib/theme.ts.
      try {
        if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
    <title>Always Connected — Campus Social App</title>
    <meta name="description" content="Always Connected: descubre, crea y únete a actividades reales en tu campus.">
